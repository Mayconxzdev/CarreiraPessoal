name: Portfolio check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-public-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify recruiter-facing structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/DECISIONS.md
          test -f docs/PRIVACY.md
          test -f docs/TESTING.md
          test -f examples/career_goal.py
          test -f examples/evidence_guard.py
          test -f examples/resume_router.py
          echo "Public portfolio structure OK"
      - name: Compile published source examples
        run: python -m compileall -q examples scripts
      - name: Public safety scan
        run: python scripts/public_safety_scan.py
