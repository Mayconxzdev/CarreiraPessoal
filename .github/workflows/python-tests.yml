name: Published source examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile published Python examples
        shell: pwsh
        run: python -m compileall -q examples scripts
      - name: Public safety scan
        shell: pwsh
        run: python scripts/public_safety_scan.py
